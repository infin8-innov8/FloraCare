{% extends "base.html" %}
{% block title %}Update Appointment Status - FloraCare{% endblock %}
{% block content %}
<h2>Update Appointment Status: {{ appointment.patient.name }} - {{ appointment.doctor_name }}</h2>

{% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="version" value="{{ appointment.version }}">
    <input type="hidden" name="pk" value="{{ appointment.pk }}">
    <div class="mb-3">
        <label>New Status</label>
        <select name="status" class="form-control">
            <option value="Scheduled">Scheduled</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
            <option value="No-show">No-show</option>
        </select>
    </div>
    <div class="mb-3">
        <label>Notes</label>
        <textarea name="notes" class="form-control" rows="3">{{ appointment.notes|default:"" }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Update Status</button>
    <a href="{% url 'appointment_list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
